<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#1a1040"/>
    </linearGradient>
    <linearGradient id="c1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b61ff"/>
    </linearGradient>
    <linearGradient id="c2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b61ff"/>
      <stop offset="100%" style="stop-color:#ff4ecd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="28" fill="url(#bg)"/>

  <g filter="url(#glow)">
    <!-- M -->
    <circle cx="75" cy="70" r="22" fill="none" stroke="url(#c1)" stroke-width="4.5"/>
    <text x="75" y="77" text-anchor="middle" fill="#00d4ff" font-size="13" font-family="monospace" font-weight="bold">M</text>
    <!-- D -->
    <circle cx="125" cy="58" r="22" fill="none" stroke="url(#c2)" stroke-width="4.5"/>
    <text x="125" y="65" text-anchor="middle" fill="#7b61ff" font-size="13" font-family="monospace" font-weight="bold">D</text>
    <!-- T -->
    <circle cx="75" cy="122" r="22" fill="none" stroke="url(#c2)" stroke-width="4.5"/>
    <text x="75" y="129" text-anchor="middle" fill="#7b61ff" font-size="13" font-family="monospace" font-weight="bold">T</text>
    <!-- H -->
    <circle cx="125" cy="110" r="22" fill="none" stroke="url(#c1)" stroke-width="4.5"/>
    <text x="125" y="117" text-anchor="middle" fill="#ff4ecd" font-size="13" font-family="monospace" font-weight="bold">H</text>

    <!-- Chain connectors -->
    <line x1="97" y1="70" x2="103" y2="58" stroke="#7b61ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="147" y1="58" x2="147" y2="110" stroke="#7b61ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="97" y1="122" x2="103" y2="110" stroke="#7b61ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="75" y1="92" x2="75" y2="100" stroke="#7b61ff" stroke-width="2.5" opacity="0.5"/>
  </g>

  <!-- Score -->
  <rect x="60" y="148" width="80" height="30" rx="6" fill="#0a0e27" stroke="#00d4ff" stroke-width="1.5" opacity="0.9"/>
  <text x="100" y="168" text-anchor="middle" fill="#00d4ff" font-size="16" font-family="monospace" font-weight="bold">95.6</text>
</svg>
