<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#1a1040"/>
    </linearGradient>
    <linearGradient id="chain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7b61ff"/>
      <stop offset="100%" style="stop-color:#ff4ecd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" rx="16" fill="url(#bg)"/>

  <!-- Chain links - 4 connected circles representing 4 agents -->
  <g filter="url(#glow)">
    <!-- Link 1 - Memory -->
    <circle cx="100" cy="90" r="24" fill="none" stroke="url(#chain)" stroke-width="5"/>
    <text x="100" y="96" text-anchor="middle" fill="#00d4ff" font-size="14" font-family="monospace" font-weight="bold">M</text>

    <!-- Link 2 - Disk -->
    <circle cx="170" cy="60" r="24" fill="none" stroke="url(#chain)" stroke-width="5"/>
    <text x="170" y="66" text-anchor="middle" fill="#7b61ff" font-size="14" font-family="monospace" font-weight="bold">D</text>

    <!-- Link 3 - Timeline -->
    <circle cx="240" cy="90" r="24" fill="none" stroke="url(#chain)" stroke-width="5"/>
    <text x="240" y="96" text-anchor="middle" fill="#7b61ff" font-size="14" font-family="monospace" font-weight="bold">T</text>

    <!-- Link 4 - Threat -->
    <circle cx="310" cy="60" r="24" fill="none" stroke="url(#chain)" stroke-width="5"/>
    <text x="310" y="66" text-anchor="middle" fill="#ff4ecd" font-size="14" font-family="monospace" font-weight="bold">H</text>
  </g>

  <!-- Connecting lines -->
  <line x1="124" y1="90" x2="146" y2="60" stroke="url(#chain)" stroke-width="3" opacity="0.6"/>
  <line x1="194" y1="60" x2="216" y2="90" stroke="url(#chain)" stroke-width="3" opacity="0.6"/>
  <line x1="264" y1="90" x2="286" y2="60" stroke="url(#chain)" stroke-width="3" opacity="0.6"/>

  <!-- Score badge -->
  <rect x="370" y="55" width="90" height="50" rx="8" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
  <text x="415" y="76" text-anchor="middle" fill="#00d4ff" font-size="10" font-family="monospace">SCORE</text>
  <text x="415" y="96" text-anchor="middle" fill="#ffffff" font-size="20" font-family="monospace" font-weight="bold">95.6</text>

  <!-- Text -->
  <text x="300" y="150" text-anchor="middle" fill="#ffffff" font-size="36" font-family="'Segoe UI',Arial,sans-serif" font-weight="bold" letter-spacing="4">
    CHAINSIGHT
  </text>
  <text x="300" y="175" text-anchor="middle" fill="#7b61ff" font-size="11" font-family="monospace" letter-spacing="2">
    4 AGENTS · 250+ CHECKS · ONE SCORE
  </text>
</svg>
