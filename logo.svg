<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#1a1040"/>
    </linearGradient>
    <linearGradient id="c1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b61ff"/>
    </linearGradient>
    <linearGradient id="c2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b61ff"/>
      <stop offset="100%" style="stop-color:#ff4ecd"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#ff4ecd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" rx="28" fill="url(#bg)"/>

  <g filter="url(#glow)">
    <circle cx="75" cy="65" r="22" fill="none" stroke="url(#c1)" stroke-width="4.5"/>
    <text x="75" y="72" text-anchor="middle" fill="#00d4ff" font-size="13" font-family="monospace" font-weight="bold">M</text>

    <circle cx="125" cy="53" r="22" fill="none" stroke="url(#c2)" stroke-width="4.5"/>
    <text x="125" y="60" text-anchor="middle" fill="#7b61ff" font-size="13" font-family="monospace" font-weight="bold">D</text>

    <circle cx="75" cy="117" r="22" fill="none" stroke="url(#c2)" stroke-width="4.5"/>
    <text x="75" y="124" text-anchor="middle" fill="#7b61ff" font-size="13" font-family="monospace" font-weight="bold">T</text>

    <circle cx="125" cy="105" r="22" fill="none" stroke="url(#c1)" stroke-width="4.5"/>
    <text x="125" y="112" text-anchor="middle" fill="#ff4ecd" font-size="13" font-family="monospace" font-weight="bold">H</text>

    <line x1="97" y1="65" x2="103" y2="53" stroke="#7b61ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="147" y1="53" x2="147" y2="105" stroke="#7b61ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="97" y1="117" x2="103" y2="105" stroke="#7b61ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="75" y1="87" x2="75" y2="95" stroke="#7b61ff" stroke-width="2.5" opacity="0.5"/>
  </g>

  <text x="100" y="170" text-anchor="middle" fill="url(#textGrad)" font-size="17" font-family="'Segoe UI',Arial,sans-serif" font-weight="bold" letter-spacing="3">CHAINSIGHT</text>
</svg>
