<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520">
  <defs>
    <style>
      text { font-family: 'Segoe UI',Arial,sans-serif; font-size: 11px; fill: #c0caf5; }
      .title { font-size: 14px; font-weight: bold; fill: #ffffff; }
      .small { font-size: 8.5px; fill: #a0a8d0; }
      .box-purple { fill: #1a1040; stroke: #7b61ff; stroke-width: 1.5; rx: 6; }
      .box-green { fill: #0d2818; stroke: #22c55e; stroke-width: 1.5; rx: 6; }
      .box-orange { fill: #281a0d; stroke: #f59e0b; stroke-width: 1.5; rx: 6; }
      .box-pink { fill: #280d1a; stroke: #ff4ecd; stroke-width: 1.5; rx: 6; }
      .arrow { stroke: #7b61ff; stroke-width: 1.5; marker-end: url(#arrowhead); fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7b61ff"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#0a0e27" rx="8"/>
  <text x="320" y="28" text-anchor="middle" class="title">ChainSight Architecture — Python Orchestrator with Rule-Based Detection</text>

  <!-- Evidence -->
  <rect x="20" y="45" width="130" height="50" class="box-orange" rx="6"/>
  <text x="85" y="65" text-anchor="middle" fill="#f59e0b" font-weight="bold" font-size="11">Evidence</text>
  <text x="85" y="82" text-anchor="middle" class="small">disk.dd · memory.vmem</text>

  <line x1="150" y1="70" x2="195" y2="70" class="arrow"/>

  <!-- SIFT Workstation -->
  <rect x="200" y="45" width="140" height="50" class="box-purple" rx="6"/>
  <text x="270" y="65" text-anchor="middle" fill="#c0caf5" font-weight="bold" font-size="11">SIFT Workstation</text>
  <text x="270" y="82" text-anchor="middle" class="small">Read-only mount · find, cat, strings</text>

  <line x1="340" y1="70" x2="385" y2="70" class="arrow"/>

  <!-- Orchestrator -->
  <rect x="390" y="35" width="230" height="70" class="box-green" rx="6"/>
  <text x="505" y="55" text-anchor="middle" fill="#22c55e" font-weight="bold" font-size="12">ChainSight Orchestrator</text>
  <text x="505" y="72" text-anchor="middle" class="small">orchestrator.py — 4-stage pipeline</text>
  <text x="505" y="88" text-anchor="middle" class="small">Zero API keys · Pure Python · Deterministic</text>

  <line x1="505" y1="105" x2="505" y2="145" class="arrow"/>

  <!-- Stage 1 -->
  <rect x="80" y="150" width="140" height="55" class="box-purple" rx="6"/>
  <text x="150" y="172" text-anchor="middle" fill="#7b61ff" font-weight="bold" font-size="10">1. COLLECT</text>
  <text x="150" y="190" text-anchor="middle" class="small">find suspicious files</text>
  <text x="150" y="200" text-anchor="middle" class="small">cat / strings contents</text>

  <line x1="220" y1="177" x2="260" y2="177" class="arrow"/>

  <!-- Stage 2 -->
  <rect x="265" y="150" width="140" height="55" class="box-green" rx="6"/>
  <text x="335" y="172" text-anchor="middle" fill="#22c55e" font-weight="bold" font-size="10">2. SCORE</text>
  <text x="335" y="190" text-anchor="middle" class="small">regex pattern matching</text>
  <text x="335" y="200" text-anchor="middle" class="small">powershell.*-enc → CRITICAL</text>

  <line x1="405" y1="177" x2="445" y2="177" class="arrow"/>

  <!-- Stage 3 -->
  <rect x="450" y="150" width="140" height="55" class="box-orange" rx="6"/>
  <text x="520" y="172" text-anchor="middle" fill="#f59e0b" font-weight="bold" font-size="10">3. CROSS-REFERENCE</text>
  <text x="520" y="190" text-anchor="middle" class="small">filesystem timestamps</text>
  <text x="520" y="200" text-anchor="middle" class="small">temporal clustering</text>

  <line x1="335" y1="205" x2="335" y2="245" class="arrow"/>

  <!-- Stage 4 -->
  <rect x="215" y="250" width="240" height="55" class="box-pink" rx="6"/>
  <text x="335" y="272" text-anchor="middle" fill="#ff4ecd" font-weight="bold" font-size="10">4. HUNT — Attack Chain Reconstruction</text>
  <text x="335" y="290" text-anchor="middle" class="small">phishing + persistence + C2 → Emotet kill chain</text>
  <text x="335" y="300" text-anchor="middle" class="small">cross-agent correlation</text>

  <line x1="335" y1="305" x2="335" y2="350" class="arrow"/>

  <!-- Outputs -->
  <rect x="140" y="355" width="180" height="60" class="box-green" rx="6"/>
  <text x="230" y="377" text-anchor="middle" fill="#22c55e" font-weight="bold" font-size="10">Forensic Confidence Score</text>
  <text x="230" y="395" text-anchor="middle" class="small">85.5 / 100 — Grade B</text>
  <text x="230" y="408" text-anchor="middle" class="small">14 pytest tests · deterministic</text>

  <rect x="355" y="355" width="180" height="60" class="box-purple" rx="6"/>
  <text x="445" y="377" text-anchor="middle" fill="#c0caf5" font-weight="bold" font-size="10">JSON Report</text>
  <text x="445" y="395" text-anchor="middle" class="small">7 findings · 3 CRITICAL</text>
  <text x="445" y="408" text-anchor="middle" class="small">every finding traceable to tool output</text>

  <!-- Security footer -->
  <rect x="20" y="440" width="600" height="50" class="box-orange" rx="6"/>
  <text x="320" y="456" text-anchor="middle" fill="#f59e0b" font-weight="bold" font-size="9">SECURITY: Read-only mount (mount -o ro,loop)</text>
  <text x="320" y="470" text-anchor="middle" fill="#f59e0b" font-weight="bold" font-size="9">subprocess.run with list-form commands · Exact tool names only (find, cat, strings)</text>
  <text x="320" y="484" text-anchor="middle" class="small">The orchestrator physically cannot modify evidence. Protection is architectural, not prompt-based.</text>
</svg>
