<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520">
  <defs>
    <style>
      text { font-family: 'Segoe UI',Arial,sans-serif; font-size: 11px; fill: #c0caf5; }
      .title { font-size: 14px; font-weight: bold; fill: #ffffff; }
      .label { font-size: 9px; fill: #7b61ff; }
      .small { font-size: 8.5px; fill: #a0a8d0; }
      .box { fill: #1a1040; stroke: #7b61ff; stroke-width: 1.5; rx: 6; }
      .box-cyan { fill: #1a1040; stroke: #00d4ff; stroke-width: 1.5; rx: 6; }
      .box-pink { fill: #1a1040; stroke: #ff4ecd; stroke-width: 1.5; rx: 6; }
      .box-green { fill: #1a1040; stroke: #22c55e; stroke-width: 1.5; rx: 6; }
      .arrow { stroke: #7b61ff; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .guardrail-prompt { stroke: #f59e0b; stroke-width: 1.2; stroke-dasharray: 5,3; marker-end: url(#arrowhead-yellow); }
      .guardrail-perm { stroke: #22c55e; stroke-width: 1.2; stroke-dasharray: 8,4; marker-end: url(#arrowhead-green); }
      .guardrail-os { stroke: #22c55e; stroke-width: 1.5; marker-end: url(#arrowhead-green); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7b61ff"/>
    </marker>
    <marker id="arrowhead-yellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#0d0820"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="520" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" class="title" font-size="16">ChainSight Architecture — Direct Agent Extension</text>

  <!-- USER / EVIDENCE -->
  <rect x="30" y="50" width="100" height="36" class="box-cyan"/>
  <text x="80" y="66" text-anchor="middle" class="title" font-size="11">Evidence</text>
  <text x="80" y="79" text-anchor="middle" class="small">disk.E01 · memory.vmem</text>

  <!-- Arrow: Evidence → SIFT -->
  <line x1="130" y1="68" x2="195" y2="68" class="arrow"/>

  <!-- SIFT WORKSTATION -->
  <rect x="200" y="50" width="140" height="36" class="box"/>
  <text x="270" y="66" text-anchor="middle" class="title" font-size="11">SIFT Workstation</text>
  <text x="270" y="79" text-anchor="middle" class="small">200+ forensic tools</text>

  <!-- Arrow: SIFT → Claude -->
  <line x1="340" y1="68" x2="405" y2="68" class="arrow"/>

  <!-- CLAUDE CODE -->
  <rect x="410" y="50" width="130" height="36" class="box-cyan"/>
  <text x="475" y="66" text-anchor="middle" class="title" font-size="11">Claude Code</text>
  <text x="475" y="79" text-anchor="middle" class="small">Protocol SIFT + ChainSight</text>

  <!-- Arrow: Claude → Orchestrator -->
  <line x1="475" y1="86" x2="475" y2="115" class="arrow"/>

  <!-- ORCHESTRATOR -->
  <rect x="340" y="118" width="270" height="40" class="box-pink"/>
  <text x="475" y="134" text-anchor="middle" class="title" font-size="12">ChainSight Orchestrator</text>
  <text x="475" y="150" text-anchor="middle" class="small">/forensic audit · 4-way parallel dispatch · Forensic Confidence Score</text>

  <!-- 4 agent arrows from orchestrator -->
  <line x1="415" y1="158" x2="230" y2="205" class="arrow"/>
  <line x1="460" y1="158" x2="400" y2="205" class="arrow"/>
  <line x1="490" y1="158" x2="550" y2="205" class="arrow"/>
  <line x1="535" y1="158" x2="620" y2="205" class="arrow"/>

  <!-- 4 SUBAGENTS -->
  <rect x="140" y="208" width="180" height="45" class="box-cyan"/>
  <text x="230" y="224" text-anchor="middle" class="title" font-size="11">Memory Agent</text>
  <text x="230" y="240" text-anchor="middle" class="small">Volatility 3: pslist · netscan · malfind</text>

  <rect x="340" y="208" width="180" height="45" class="box"/>
  <text x="430" y="224" text-anchor="middle" class="title" font-size="11">Disk Agent</text>
  <text x="430" y="240" text-anchor="middle" class="small">Sleuth Kit: MFT · Prefetch · Registry</text>

  <rect x="540" y="208" width="160" height="45" class="box"/>
  <text x="620" y="224" text-anchor="middle" class="title" font-size="11">Timeline Agent</text>
  <text x="620" y="240" text-anchor="middle" class="small">Plaso · 6 correlation rules</text>

  <rect x="140" y="268" width="560" height="36" class="box"/>
  <text x="420" y="284" text-anchor="middle" class="title" font-size="11">Threat Agent</text>
  <text x="420" y="300" text-anchor="middle" class="small">YARA · Sigma · IOC sweep · Anomaly scoring (hash + yara + sigma + multi_source - signed_discount)</text>

  <!-- Arrow: Agents → Synthesizer -->
  <line x1="420" y1="304" x2="420" y2="335" class="arrow"/>

  <!-- SYNTHESIZER -->
  <rect x="260" y="338" width="320" height="45" class="box-pink"/>
  <text x="420" y="354" text-anchor="middle" class="title" font-size="12">Synthesizer</text>
  <text x="420" y="370" text-anchor="middle" class="small">Cross-reference · Self-correction (CLAIM→EXTRACT→DOUBT→RECONCILE→STOP)</text>

  <!-- Output arrows -->
  <line x1="350" y1="383" x2="300" y2="430" class="arrow"/>
  <line x1="490" y1="383" x2="540" y2="430" class="arrow"/>

  <!-- Outputs -->
  <rect x="220" y="433" width="160" height="36" class="box-green"/>
  <text x="300" y="449" text-anchor="middle" class="title" font-size="11">PDF Report</text>
  <text x="300" y="465" text-anchor="middle" class="small">WeasyPrint · evidence chain</text>

  <rect x="460" y="433" width="160" height="36" class="box-green"/>
  <text x="540" y="449" text-anchor="middle" class="title" font-size="11">Confidence Score</text>
  <text x="540" y="465" text-anchor="middle" class="small">0-100 · Grade A-F · deterministic</text>

  <!-- GUARDRAIL LEGEND (bottom) -->
  <rect x="30" y="440" width="170" height="68" class="box"/>
  <text x="115" y="456" text-anchor="middle" class="title" font-size="10">Guardrails</text>
  <line x1="45" y1="470" x2="85" y2="470" class="guardrail-prompt"/>
  <text x="95" y="474" class="small">Prompt-based (CLAUDE.md)</text>
  <line x1="45" y1="487" x2="85" y2="487" class="guardrail-perm"/>
  <text x="95" y="491" class="small">Permission (settings.json)</text>
  <line x1="45" y1="504" x2="85" y2="504" class="guardrail-os"/>
  <text x="95" y="508" class="small">OS-level (read-only mount)</text>
</svg>
